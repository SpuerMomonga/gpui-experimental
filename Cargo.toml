[workspace]
resolver = "3"
members = [
    "crates/assets",
    "crates/collections",
    "crates/command",
    "crates/macros",
    "crates/command-palette",
    "crates/desktop",
    "crates/preview",
    "crates/ui",
    "crates/view",
    "crates/workspace",
]
default-members = ["crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["SpuerMomonga"]
license = "AGPL-3.0"

[workspace.dependencies]

#
# Workspace member crates
#

assets = { path = "crates/assets" }
collections = { path = "crates/collections" }
command = { path = "crates/command" }
command-palette = { path = "crates/command-palette" }
preview = { path = "crates/preview" }
macros = { path = "crates/macros" }
view = { path = "crates/view" }
workspace = { path = "crates/workspace" }

#
# External crates
#

anyhow = "1"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
rustc-hash = "2.1.3"
rust-embed = { version = "8.11", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
slotmap = "1.1.1"
