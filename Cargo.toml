[workspace]
resolver = "3"
members = [
    "crates/assets",
    "crates/collections",
    "crates/command",
    "crates/command-palette",
    "crates/desktop",
    "crates/ui",
    "crates/workspace",
]
default-members = ["crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["SpuerMomonga"]
license = "AGPL-3.0"

[workspace.dependencies]

#
# Workspace member crates
#

assets = { path = "crates/assets" }
collections = { path = "crates/collections" }
command = { path = "crates/command" }
command-palette = { path = "crates/command-palette" }
ui = { path = "crates/ui" }
workspace = { path = "crates/workspace" }

#
# External crates
#

anyhow = "1"
gpui-kit = "0.6"
rustc-hash = "2.1.3"
rust-embed = { version = "8.11", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
slotmap = "1.1.1"
uuid = { version = "1.26.1", features = ["v4", "v5", "v7", "serde"] }
